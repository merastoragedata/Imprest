<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Imprest Management Portal · MSETCL</title>
<style>
:root{
  --navy-950:#07111F;--navy-900:#0D1628;--navy-800:#101826;--navy-700:#1c2b4a;
  --steel-300:#94A3B8;--steel-400:#7c8aa8;--steel-600:#54627e;--steel-700:#3c4763;--ink:#101826;
  --gold-400:#D4AF37;--gold-500:#C8A45D;--gold-600:#a8842f;--copper:#C8A45D;
  --ok-500:#1e8a5f;--ok-100:#e3f6ec;--warn-100:#fbf2dc;--bad-500:#c4453a;--bad-100:#fbe9e7;--info-500:#3b54c4;--info-100:#eaecfb;
  --surface:#fff;--surface-2:#f4f6fb;--surface-3:#eaeef6;--line:#e2e7f0;--line-strong:#cdd5e6;
  --radius-sm:7px;--radius-md:12px;--radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(13,22,40,.06);--shadow-md:0 6px 20px rgba(13,22,40,.10);--shadow-lg:0 18px 48px rgba(7,17,31,.20);
  --font-display:'Sora',system-ui,sans-serif;--font-heading:'Space Grotesk',system-ui,sans-serif;--font-body:'Plus Jakarta Sans','Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--surface-2);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:-.01em;color:var(--navy-900)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button{font-family:inherit}
img{max-width:100%}

/* shell */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:var(--navy-900);color:#fff;box-shadow:var(--shadow-md)}
.topbar-row1{display:flex;align-items:center;gap:10px;padding:0 14px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:15px;min-width:0}
.brand .bolt{width:22px;height:22px;flex:none;color:var(--gold-400)}
.brand .sub{font-weight:500;font-size:10.5px;color:var(--steel-300);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.topbar-spacer{flex:1}
.nav-toggle{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:6px 8px;border-radius:6px;display:inline-flex;flex:none}
.nav-toggle:hover{background:rgba(255,255,255,.12)}
.role-chip{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:rgba(232,184,75,.16);color:var(--gold-400);border:1px solid rgba(232,184,75,.35);white-space:nowrap;flex:none}
.user-pill{display:flex;align-items:center;gap:7px;padding:5px 8px 5px 5px;border-radius:99px;background:rgba(255,255,255,.08);cursor:pointer;border:none;color:#fff;flex:none;min-width:0}
.user-pill:hover{background:rgba(255,255,255,.16)}
.user-pill-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--gold-400),var(--copper));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10.5px;color:var(--navy-950);flex:none}
.shell{flex:1;display:flex;min-height:0}
.sidenav{width:210px;flex:none;background:var(--navy-950);color:var(--steel-300);display:flex;flex-direction:column;padding:14px 10px;gap:2px;transition:width .18s ease}
.sidenav.collapsed{width:58px;padding:14px 6px}
.sidenav.collapsed .lbl{display:none}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--steel-300);border:none;background:none;width:100%;text-align:left}
.sidenav.collapsed .nav-item{justify-content:center;padding:9px 4px}
.nav-item .ic{width:18px;text-align:center;flex:none;font-size:15px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(232,184,75,.18),rgba(232,184,75,.05));color:var(--gold-400);box-shadow:inset 3px 0 0 var(--gold-400)}
.nav-divider{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
.main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:20px 24px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-title{font-size:19px;font-family:var(--font-heading);word-break:break-word}
.page-sub{color:var(--steel-600);font-size:12.5px;margin-top:3px}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* mobile: sidebar becomes a horizontal top strip */
@media(max-width:760px){
  .shell{flex-direction:column}
  .sidenav,.sidenav.collapsed{width:100%;flex-direction:row;padding:6px 8px;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .sidenav .nav-item,.sidenav.collapsed .nav-item{width:auto;flex:none;padding:8px 12px;justify-content:flex-start}
  .sidenav.collapsed .lbl{display:inline}
  .nav-divider{width:1px;height:auto;margin:4px 2px;align-self:stretch}
  .sidenav .nav-item.active{box-shadow:inset 0 -3px 0 var(--gold-400)}
  .main{padding:14px 12px 50px}
  .topbar-row1{height:52px;padding:0 10px}
  .brand .sub{display:none}
  .user-pill-name{max-width:70px}
}
@media(max-width:420px){
  .role-chip{display:none}
}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:16px;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.card-head h3{font-size:14px}
.grid{display:grid;gap:14px}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid-4{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.grid-4{grid-template-columns:1fr 1fr;gap:10px}}

/* stat cards */
.stat-card{display:flex;flex-direction:column;gap:2px;background:linear-gradient(135deg,var(--surface) 60%,var(--surface-2));position:relative;overflow:hidden;padding:14px}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(232,184,75,.14),transparent 70%);transform:translate(20px,-20px)}
.stat-ic{font-size:19px;margin-bottom:4px}
.stat-val{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--navy-900);line-height:1.15;word-break:break-word}
.stat-label{font-size:10px;color:var(--steel-600);font-weight:700;text-transform:uppercase;letter-spacing:.03em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-family:var(--font-body);font-weight:600;font-size:12.5px;line-height:1;cursor:pointer;border-radius:var(--radius-sm);border:1px solid transparent;padding:9px 13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--navy-900);color:#fff}
.btn-primary:hover{background:var(--navy-800)}
.btn-gold{background:linear-gradient(135deg,var(--gold-400),var(--gold-500));color:var(--navy-950)}
.btn-ghost{background:transparent;color:var(--navy-800);border-color:var(--line-strong)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-danger{background:var(--bad-100);color:var(--bad-500)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-xs{padding:3px 7px;font-size:10.5px}
.btn-block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:99px;padding:3px;flex-wrap:nowrap}
.seg button{border:none;background:none;padding:6px 12px;font-size:12px;font-weight:700;color:var(--steel-600);border-radius:99px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--navy-900);color:#fff}

/* forms */
label{display:block;font-size:11.5px;font-weight:600;color:var(--steel-700);margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:13.5px;background:var(--surface);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-700);box-shadow:0 0 0 3px rgba(28,54,102,.12)}
textarea{resize:vertical;min-height:56px}
input[type=file]{padding:6px;font-size:12px}
.field{margin-bottom:12px}
.field-row{display:flex;gap:10px;flex-wrap:wrap}
.field-row>*{flex:1;min-width:120px}
.hint{font-size:11px;color:var(--steel-600);margin-top:4px}
.radio-pill-group{display:flex;gap:7px;flex-wrap:wrap}
.radio-pill{padding:7px 12px;border-radius:99px;border:1.5px solid var(--line-strong);cursor:pointer;font-size:12px;font-weight:600;color:var(--steel-700);background:var(--surface)}
.radio-pill.sel{background:var(--navy-900);border-color:var(--navy-900);color:#fff}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:700;white-space:nowrap}
.badge-gold{background:var(--warn-100);color:var(--gold-600)}
.badge-ok{background:var(--ok-100);color:var(--ok-500)}
.badge-info{background:var(--info-100);color:var(--info-500)}
.badge-bad{background:var(--bad-100);color:var(--bad-500)}
.badge-neutral{background:var(--surface-3);color:var(--steel-700)}

/* dashboard entry cards */
.est-card{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius-md);border:1px solid var(--line);background:var(--surface);cursor:pointer;margin-bottom:8px;flex-wrap:wrap}
.est-card:hover{box-shadow:var(--shadow-md);border-color:var(--steel-400)}
.est-sno{flex:none;width:20px;text-align:center;font-family:var(--font-mono);font-weight:700;font-size:11px;color:var(--steel-600)}
.est-icon{width:36px;height:36px;border-radius:9px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--navy-800);flex:none}
.est-main{flex:1;min-width:140px}
.est-title{font-weight:700;font-size:13px;color:var(--navy-900);word-break:break-word}
.est-meta{margin-top:2px;font-size:11px}
.est-right{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.est-amt{font-weight:800;color:var(--gold-600);font-size:13px}
.est-actions{display:flex;gap:4px}
.cat-head{font-family:var(--font-display);font-weight:700;font-size:13.5px;color:var(--navy-900);display:flex;align-items:center;gap:8px;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--gold-500)}
@media(max-width:560px){
  .est-card{padding:10px}
  .est-sno{display:none}
  .est-right{width:100%;flex-direction:row;justify-content:space-between;align-items:center;order:3}
  .est-actions{width:100%;order:4;justify-content:flex-end}
}

/* collapsibles */
.collapse{border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;margin-bottom:12px;background:var(--surface)}
.collapse-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none;font-weight:700;font-size:13px;color:var(--navy-900);gap:8px}
.collapse-head:hover{background:var(--surface-2)}
.collapse-head .chev{transition:transform .2s;color:var(--steel-600);flex:none}
.collapse.open .collapse-head .chev{transform:rotate(90deg)}
.collapse-body{display:none;padding:2px 14px 14px}
.collapse.open .collapse-body{display:block}
.locked-note{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--warn-100);color:var(--gold-600);border-radius:var(--radius-sm);font-size:12px;font-weight:600}
.detail-head-main{display:flex;align-items:center;gap:10px;min-width:0}
.detail-subject{font-weight:800;font-size:15px;color:var(--navy-900);word-break:break-word}

/* checklist */
.chk-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.chk-row:last-child{border-bottom:none}
.chk-box{width:19px;height:19px;flex:none;margin-top:1px;accent-color:var(--navy-800)}
.chk-main{flex:1;min-width:0}
.chk-title{font-weight:600;font-size:12.5px;color:var(--navy-900)}

/* txn / voucher / pavati */
.txn{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface);flex-wrap:wrap}
.txn.recv{border-left:3px solid var(--ok-500)}
.txn.exp{border-left:3px solid var(--info-500)}
.txn-main{flex:1;min-width:130px}
.txn-title{font-weight:700;font-size:12.5px}
.txn-amt{font-weight:800;font-size:12.5px}
.txn-actions{width:100%;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;order:5}
.thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;border:1px solid var(--line);flex:none}
.flag-nobill{font-size:10px;font-weight:700;color:var(--bad-500);background:var(--bad-100);padding:2px 7px;border-radius:99px;white-space:nowrap}
.pavati-box{width:100%;order:6;background:var(--surface-2);border-radius:var(--radius-sm);padding:12px;margin-top:8px}
.txn-form-card{margin-top:8px}

/* Form-2 table */
.form2-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--radius-sm)}
.form2-table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
.form2-table th,.form2-table td{padding:7px 9px;border:1px solid var(--line-strong);text-align:center;white-space:nowrap}
.form2-table td:nth-child(3){white-space:normal;min-width:180px;text-align:center}
.form2-table th{background:var(--surface-2);font-weight:700;color:var(--navy-800);text-align:center}
.form2-table td.num,.form2-table th.num{font-family:var(--font-mono);text-align:center}
.form2-table tfoot td{font-weight:700;background:var(--surface-2);text-align:center}

/* letter — real A4 page, scaled to fit any screen (print-preview look) */
.letter-scale-outer{width:100%;overflow:hidden;position:relative}
.letter-page{
  width:794px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-md);
  padding:60px 64px;font-family:Georgia,'Times New Roman',serif;font-size:14px;color:#1a1a1a;line-height:1.7;
}
.lt-org{font-weight:700;font-size:16px;text-align:center}
.lt-iso{text-align:center;font-size:11.5px;margin:5px 0 22px}
.lt-send{font-size:12px;margin-bottom:10px;white-space:pre-wrap}
.lt-ref{display:flex;justify-content:space-between;font-size:13px;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.lt-to{margin-bottom:16px}.lt-sub{margin-bottom:14px}.lt-salut{margin-bottom:10px}
.lt-para{margin-bottom:11px;text-indent:1.5em;text-align:justify}
.lt-ghost{color:#b7b2a4;font-style:italic}
.lt-encl{margin-bottom:16px;font-size:12.5px}.lt-encl ol{margin:4px 0 0 18px;padding:0}
.lt-emp{text-align:right;margin:24px 0 28px}
.lt-rec{border-top:1px dashed var(--line-strong);padding-top:14px}

/* rich text toolbar — expanded */
.rt-toolbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;background:var(--surface-2);padding:6px;border:1.5px solid var(--line-strong);border-bottom:none}
.rt-toolbar:first-of-type{border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.rt-toolbar2{border-top:1px dashed var(--line-strong)}
.rt-font{width:auto;flex:none;padding:5px 7px;font-size:11.5px;border:1px solid var(--line-strong);border-radius:6px;background:#fff}
.rt-size{width:auto;flex:none;padding:5px 6px;font-size:11.5px;border:1px solid var(--line-strong);border-radius:6px;background:#fff}
.rt-btn{background:#fff;border:1px solid var(--line-strong);border-radius:6px;width:28px;height:26px;font-size:12px;cursor:pointer;color:var(--navy-800);flex:none}
.rt-btn:hover{background:var(--surface-3)}
.rt-div{width:1px;height:20px;background:var(--line-strong);margin:0 3px;flex:none}
.rt-swatch-label{font-size:10px;font-weight:700;color:var(--steel-600);text-transform:uppercase;margin-right:2px}
.rt-color,.rt-hicolor{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.2);cursor:pointer;padding:0;flex:none}
.rt-hicolor{border-radius:5px}
.rt-editor{min-height:64px;border:1.5px solid var(--line-strong);border-radius:0 0 var(--radius-sm) var(--radius-sm);padding:9px 11px;font-size:13.5px;background:#fff;outline:none;font-family:var(--font-body);color:#101826}
.rt-editor:focus{border-color:var(--navy-700);box-shadow:0 0 0 3px rgba(28,54,102,.10)}

/* toast */
#toast-stack{position:fixed;bottom:16px;right:16px;left:16px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--navy-950);color:#fff;padding:10px 15px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;box-shadow:var(--shadow-lg);transition:all .3s;max-width:320px}
.toast.ok{background:var(--ok-500)}.toast.err{background:var(--bad-500)}.toast.warn{background:var(--gold-600)}

/* auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,var(--navy-800),var(--navy-950) 60%);padding:16px}
.auth-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:400px;padding:28px 24px}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:18px;text-align:center}
.auth-logo .bolt{width:38px;height:38px;color:var(--gold-500)}
.auth-logo h1{font-size:17px}
.auth-logo p{font-size:11.5px;color:var(--steel-600);margin:2px 0 0}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px}
.tab{padding:9px 16px;font-size:12.5px;font-weight:700;color:var(--steel-600);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--navy-900);border-color:var(--gold-500)}

@media(max-width:380px){
  .auth-card{padding:22px 18px}
  .page-title{font-size:17px}
  .letter-page{padding:40px 34px;font-size:12.5px}
}

/* modal (overspend popup) */
.modal-overlay{position:fixed;inset:0;background:rgba(7,17,31,.55);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.modal-box{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:26px 24px;max-width:360px;width:100%;text-align:center}
.modal-title{font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--bad-500);margin-bottom:8px}
.modal-msg{font-size:13.5px;color:var(--navy-800);margin-bottom:18px;line-height:1.5}

/* utilization banners + closure cards */
.util-banner{display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;margin-bottom:12px}
.util-warn{background:var(--warn-100);color:var(--gold-600)}
.util-bad{background:var(--bad-100);color:var(--bad-500)}
.cycle-divider{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:11px;font-weight:700;color:var(--steel-600);text-transform:uppercase;letter-spacing:.03em}
.cycle-divider::before,.cycle-divider::after{content:'';flex:1;height:1px;background:var(--line-strong)}
.recoup-badge{background:var(--gold-500);color:var(--navy-950);font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.closure-card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;margin-top:10px}

</style>
</head>
<body>
<div id="app"></div>
<div id="toast-stack"></div>
<script>
/* Imprest Management Portal — app logic (in-memory store; Apps Script later) */
(function () {
  "use strict";

  var DB = { employees: {}, entries: {} };
  var state = {
    screen: "auth", authTab: "login", user: null,
    entries: [], scope: "fy",
    detailId: null, createStep: null,
    error: "", open: {}, sideCollapsed: false,
    modal: null, // {title, message}
  };
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var FONT_OPTIONS = [
    {label:"Default", val:"Plus Jakarta Sans, Arial, sans-serif"},
    {label:"Arial", val:"Arial, Helvetica, sans-serif"},
    {label:"Times New Roman", val:"'Times New Roman', Times, serif"},
    {label:"Georgia", val:"Georgia, serif"},

  function fmtDate(iso){ if(!iso) return "—"; var p=iso.split("-"); if(p.length!==3) return iso; return parseInt(p[2],10)+"-"+MONTHS[parseInt(p[1],10)-1]+"-"+p[0]; }
  function fyOf(iso){ if(!iso) return ""; var p=iso.split("-").map(function(x){return parseInt(x,10);}); var y=p[0],m=p[1]; return m>=4? y+"-"+String(y+1).slice(-2) : (y-1)+"-"+String(y).slice(-2); }

  function inr(n){ var v=parseFloat(n); if(!isFinite(v)) return "0"; return v.toLocaleString("en-IN",{maximumFractionDigits:2}); }

  function totals(e){
    var recv=0, exp=0, noBill=false;
    (e.txns||[]).forEach(function(t){
      if(t.kind==="received") recv+=parseFloat(t.amount)||0;
      else { exp+=parseFloat(t.amount)||0; if(t.billAvailable==="no") noBill=true; }
    });
    return { recv:recv, exp:exp, balance:recv-exp, noBill:noBill };
  }
  // ── PI cycle helpers ──
  function lastRecoupmentTxnIndex(e){
    var rc=(e.recoupments||[]).filter(function(r){return !r.final;});
    for(var i=rc.length-1;i>=0;i--){
      var id=rc[i].id;
      for(var j=0;j<(e.txns||[]).length;j++){ if(e.txns[j].recoupmentId===id) return j; }
    }
    return -1;
  }
  function cycleNumber(e){ return (e.recoupments||[]).filter(function(r){return !r.final;}).length + 1; }
  var WARN_PCT = { TI:80, PI:90 };
  function utilization(e){
    var t=totals(e);
    if(e.type==="TI"){
      var amt=parseFloat(e.amount)||0;
      return { cycleExp:t.exp, limit:amt, pct: amt? (t.exp/amt*100):0, overspent: t.exp>amt, warn: amt? (t.exp/amt*100)>=WARN_PCT.TI : false };
    }
    var idx=lastRecoupmentTxnIndex(e);
    var cycleExp=(e.txns||[]).filter(function(x,i){ return x.kind==="expense" && i>idx; }).reduce(function(s,x){return s+(parseFloat(x.amount)||0);},0);
    var limit=parseFloat(e.amount)||0;
    return { cycleExp:cycleExp, limit:limit, pct: limit? (cycleExp/limit*100):0, overspent: cycleExp>limit, warn: limit? (cycleExp/limit*100)>=WARN_PCT.PI : false };
  }
  function expenseTxns(e){ return (e.txns||[]).filter(function(t){return t.kind==="expense";}); }
  function voucherNoFor(e,txnId){ var list=expenseTxns(e); for(var i=0;i<list.length;i++){ if(list[i].id===txnId) return "V"+(i+1); } return "V?"; }

  function applyFontSize(ed,pt){

  // ── Parse a paragraph's contenteditable HTML into styled runs (for Word/PDF) ──
  function parseRichHtml(html){
    var container=document.createElement("div");
    container.innerHTML=html||"";
    var align="justify";
    var alignEl=container.querySelector("[style*='text-align']");
    if(alignEl){
      var m=/text-align:\s*(\w+)/i.exec(alignEl.getAttribute("style")||"");
      if(m) align=m[1];
    } else if(/text-align:\s*(\w+)/i.test(container.getAttribute("style")||"")){
      align=/text-align:\s*(\w+)/i.exec(container.getAttribute("style"))[1];
    }
    var runs=[];
    function walk(node,style){
      if(node.nodeType===3){
        if(node.textContent) runs.push({text:node.textContent,bold:style.bold,italic:style.italic,underline:style.underline,color:style.color,font:style.font,size:style.size});
        return;
      }
      if(node.nodeType!==1) return;
      var s={bold:style.bold,italic:style.italic,underline:style.underline,color:style.color,font:style.font,size:style.size};
      var tag=node.tagName.toLowerCase();
      if(tag==="b"||tag==="strong") s.bold=true;
      if(tag==="i"||tag==="em") s.italic=true;
      if(tag==="u") s.underline=true;
      if(tag==="font"){
        if(node.getAttribute("color")) s.color=node.getAttribute("color");
        if(node.getAttribute("face")) s.font=node.getAttribute("face");
      }
      var inlineStyle=node.getAttribute("style")||"";
      var cm=/color:\s*(#[0-9a-fA-F]{3,6}|rgb\([^)]+\))/i.exec(inlineStyle); if(cm) s.color=cm[1];
      var fm=/font-family:\s*([^;]+)/i.exec(inlineStyle); if(fm) s.font=fm[1].trim();
      var szm=/font-size:\s*([\d.]+)pt/i.exec(inlineStyle); if(szm) s.size=parseFloat(szm[1]);
      var fw=/font-weight:\s*(bold|700|800|900)/i.exec(inlineStyle); if(fw) s.bold=true;
      var fs=/font-style:\s*italic/i.exec(inlineStyle); if(fs) s.italic=true;
      var td=/text-decoration[^:]*:\s*[^;]*underline/i.exec(inlineStyle); if(td) s.underline=true;
      if(tag==="br"){ runs.push({text:"\n",bold:false,italic:false,underline:false}); return; }
      node.childNodes.forEach(function(ch){ walk(ch,s); });
    }
    container.childNodes.forEach(function(ch){ walk(ch,{}); });
    return { align:align, runs:runs };
  }
  function runsToPlainText(parsed){ return parsed.runs.map(function(r){return r.text;}).join("").trim(); }

  function renderLedger(e){
    var all=(e.txns||[]).slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
    var html=""; var cycleSeen=1;
    html+='<div class="cycle-divider">Cycle '+cycleSeen+'</div>';
    all.forEach(function(tx){
      html+=txnRow(e,tx);
      if(tx.recoupmentId){ cycleSeen++; html+='<div class="cycle-divider">Cycle '+cycleSeen+' begins</div>'; }
    });
    return html;

  function historyInner(e){
    var items=[];
    (e.recoupments||[]).forEach(function(r){ items.push({kind:"recoup",data:r}); });
    if(e.closure) items.push({kind:"closure",data:e.closure});
    if(!items.length) return '<div class="hint">No recoupment or closure actions yet.</div>';
    return items.map(historyItemHtml).join("");

    if(it.kind==="closure"){
      var c=it.data;
      var label = c.kind==="return" ? "Closure — Amount Returned" : "Closure — Reimbursement";
      var badge = c.stage==="done" ? '<span class="badge badge-ok">Done</span>' : '<span class="badge badge-gold">Pending</span>';
      var body='<div class="closure-card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>'+label+'</b>'+badge+'</div>'+
        '<div class="hint">Rs. '+inr(c.amount)+(c.stage==="done"?(' · '+fmtDate(c.date)+(c.mode==="online"?(' · UTR '+esc(c.utr||"—")):" · Cash")):"")+'</div>';

        body+='<button class="btn btn-primary btn-sm" id="hist_markReimbursed" style="margin-top:8px">Mark Reimbursed</button><div id="reimburseFormHost"></div>';
      }
      return body+'</div>';
    }
    var r=it.data;
    if(r.final){
      return '<div class="closure-card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>Final settlement · '+fmtDate(r.date)+'</b><span class="badge badge-neutral">See Closure entry</span></div>'+

    var body='<div class="closure-card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>Recoupment · '+fmtDate(r.date)+'</b>'+badge+'</div>'+
      '<div class="hint">Overspent settled Rs. '+inr(r.overspentAmount)+' + Fresh Rs. '+inr(r.freshAmount)+' = Total Rs. '+inr(r.totalCredit)+(r.mode==="online"?(' · UTR '+esc(r.utr||"—")):" · Cash")+'</div>';
    if(r.settled==="pending"){
      body+='<div class="hint" style="margin:6px 0">Has the higher authority settled/approved this recoupment?</div>'+
        '<div class="btn-row"><button class="btn btn-primary btn-sm" data-settleyes="'+r.id+'">Yes — Settled</button><button class="btn btn-ghost btn-sm" data-settleno="'+r.id+'">Not Yet</button></div>';
    } else if(r.settledRemark){
      body+='<div class="hint">Remark: '+esc(r.settledRemark)+'</div>';
    }
    return body+'</div>';
  }

  // Form-2 inner
  function form2Inner(e,t){
    var F=e.form2, u=state.user;
    var sapVal = F.sapNo || u.sapNo || "";
    var cpfVal = F.cpfNo || u.cpfNo || "";
    var pmoVal = F.pmoNo || u.pmoNo || "";
    var allTxns=(e.txns||[]).slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
    var rows=allTxns.map(function(tx,i){
      var particulars = tx.kind==="received" ? ("Amount received as "+e.type) : (esc(tx.nameOfWork||tx.paidTo||"Expense")+(tx.billAvailable==="no"?" (Bill not received)":" ("+voucherNoFor(e,tx.id)+")"));
      var recv = tx.kind==="received" ? inr(tx.amount) : "";
      var pay = tx.kind==="expense" ? inr(tx.amount) : "";
      return '<tr><td>'+(i+1)+'</td><td>'+fmtDate(tx.date)+'</td><td>'+particulars+'</td><td class="num">'+recv+'</td><td class="num">'+pay+'</td></tr>';
    }).join("");
    var table='<table class="form2-table"><thead><tr><th>Sno</th><th>Date</th><th>Particulars</th><th>Receipt (Rs.)</th><th>Payment (Rs.)</th></tr></thead><tbody>'+
      (rows||'<tr><td colspan="5" class="hint" style="text-align:center;padding:14px">No transactions logged yet.</td></tr>')+
      '</tbody><tfoot><tr><td colspan="3">Total</td><td class="num">'+inr(t.recv)+'</td><td class="num">'+inr(t.exp)+'</td></tr>'+
      '<tr><td colspan="3">Balance (Receipt − Payment)</td><td class="num" colspan="2">'+inr(t.balance)+'</td></tr></tfoot></table>';

    var settleField = t.balance>=0
      ? '<div class="field-row">'+f2v("f2_paidback","Amount Paid Back (Rs.)",F.amountPaidBack||t.balance)+f2v("f2_acct","Refund Account No.",F.refundAccount)+'</div>'+
        f2v("f2_utr","Refund UTR / Transaction No.",F.refundUTR)
      : '<div class="field-row">'+f2v("f2_paidback","Extra Amount Paid from Pocket (Rs.)",F.amountPaidBack||(-t.balance))+'</div>'+
        '<div class="locked-note" style="margin-bottom:12px">Kindly reimburse the same.</div>'+
        f2v("f2_utr","Reimbursement UTR / Transaction No.",F.refundUTR);

    var fields='<div class="field-row">'+f2v("f2_sap","SAP No.",sapVal)+f2v("f2_cpf","CPF No.",cpfVal)+f2v("f2_pmo","PMO No. (optional)",pmoVal)+'</div>'+
      '<div class="field-row"><div class="field"><label>Period from</label><input type="date" id="f2_from" value="'+esc(F.dateFrom)+'"></div><div class="field"><label>Period to</label><input type="date" id="f2_to" value="'+esc(F.dateTo)+'"></div></div>'+
      settleField+
      '<div class="btn-row" style="margin-bottom:14px"><button class="btn btn-ghost btn-sm" id="f2_back">← Back</button><button class="btn btn-primary btn-sm" id="f2_save">Save Form-2 details</button></div>';

    return fields+'<div class="form2-scroll">'+table+'</div>'+
      '<div class="btn-row" style="margin-top:14px">'+
        '<button class="btn btn-gold btn-sm" id="f2_excel">⬇ Excel (.xlsx)</button>'+
        '<button class="btn btn-ghost btn-sm" id="f2_pdf">⬇ PDF</button>'+
        '<button class="btn btn-ghost btn-sm" id="f2_word">⬇ Word (open in Google Docs)</button>'+
        '<button class="btn btn-ghost btn-sm" id="f2_print">🖶 Print</button>'+
      '</div>'+
      '<div class="hint" style="margin-top:8px">Note: styled borders/center-alignment in the Excel export depend on the free client-side library\\u2019s support — if it doesn\\u2019t render, the Web preview, PDF, and Print all show the fully bordered/centered version.</div>';
  }
  function f2v(id,label,v){ return '<div class="field"><label>'+esc(label)+'</label><input id="'+id+'" value="'+esc(v==null?"":v)+'"></div>'; }

  // ── Profile ──

    var p=state.user;
    var methodNote = p.authMethod==="google"

  function previewEntry(p){ return { type:"TI", letter:{refPrefix:p.letterNo,refNumber:"",refDate:todayISO(),sendingAddress:"",bodyParas:["","","",""],attachments:[]}, subject:"", amount:"" }; }

  // ── Letter render (A4 page, will be scaled to fit) ──
  function letterSheet(p,e){
    var L=e.letter||e; var bd=p.bossDesignation||"[ Boss's designation ]",bo=p.bossOffice||"[ Boss's office ]",bg=p.bossOrg||"MSETCL";
    var atts=(L.attachments||[]).filter(Boolean); var salut=p.bossSalutation==="Madam"?"Madam":"Sir";
    var paras=(L.bodyParas||["","","",""]).map(function(x,i){return x?'<div class="lt-para">'+x+'</div>':'<div class="lt-para lt-ghost">[ Paragraph '+(i+1)+' ]</div>';}).join("");
    return '<div class="letter-page"><div class="lt-org">MAHARASHTRA STATE ELECTRICITY TRANSMISSION COMPANY LTD.</div><div class="lt-iso">An ISO 9001:2000 CERTIFIED ORGANISATION</div>'+
      (L.sendingAddress?'<div class="lt-send">'+esc(L.sendingAddress)+'</div>':'')+
      '<div class="lt-ref"><span>'+esc(L.refPrefix||"Ref. [ Prefix ] No.")+' '+esc(L.refNumber||"__")+'</span><span>Date: '+fmtDate(L.refDate)+'</span></div>'+
      '<div class="lt-to">To,<br>The '+esc(bd)+',<br>'+esc(bo)+'<br>'+esc(bg)+'</div>'+
      '<div class="lt-sub"><b>Sub:</b>&nbsp;&nbsp;'+esc(e.subject||((e.type||"TI")+" Application of Rs [amount] for [purpose]."))+'</div>'+
      '<div class="lt-salut">Respected '+salut+',</div><div class="lt-body">'+paras+'</div>'+
      (atts.length?'<div class="lt-encl"><b>Encl:</b><ol>'+atts.map(function(a){return '<li>'+esc(a)+'</li>';}).join("")+'</ol></div>':'')+
      '<div class="lt-emp"><div style="font-weight:700">'+esc(p.name||"[ Your name ]")+'</div><div>'+esc(p.designation||"[ Your designation ]")+'</div><div>'+esc(p.office||"[ Your office ]")+'</div></div>'+
      '<div class="lt-rec"><div style="font-weight:700">Recommended By,</div><div style="height:18px"></div><div style="font-weight:700">'+esc(p.bossName||"[ Boss's name ]")+'</div><div>'+esc(bd)+'</div><div>'+esc(bo)+'</div><div>'+esc(bg)+'</div></div></div>';
  }

  function fitLetterPages(){
    document.querySelectorAll(".letter-scale-outer").forEach(function(wrap){
      var page=wrap.querySelector(".letter-page");
      if(!page) return;
      page.style.transform="none";
      var avail=wrap.clientWidth;
      var scale=Math.min(1, avail/794);
      page.style.transform="scale("+scale+")";
      page.style.transformOrigin="top left";
      wrap.style.height=(page.scrollHeight*scale)+"px";
    });
  }
  window.addEventListener("resize", function(){ fitLetterPages(); });

  // ═══════════ RENDER ROOT ═══════════
  function render(){
    var app=document.getElementById("app");
    var html;
    if(state.screen==="auth") html=renderAuth();
    else if(state.screen==="admin") html=renderAdminPanel();
    else if(state.screen==="create") html=renderCreate();
    else if(state.screen==="detail") html=renderDetail();
    else if(state.screen==="profile") html=renderProfile();
    else html=renderHome();
    app.innerHTML=html+renderModal();
    wire();
    byId("modalOk",function(el){el.onclick=function(){state.modal=null;render();};});
    setTimeout(fitLetterPages, 0);
  }

  function wire(){
    if(state.screen==="auth"){ wireAuth(); return; }
    if(state.screen==="admin"){ wireAdminPanel(); return; }
    byId("logoutPill",function(el){el.onclick=doLogout;});
    byId("sideToggle",function(el){el.onclick=function(){state.sideCollapsed=!state.sideCollapsed;render();};});
    document.querySelectorAll("[data-nav]").forEach(function(el){el.onclick=function(){state.screen=el.getAttribute("data-nav");render();};});
    byId("navCreate",function(el){el.onclick=startCreate;});
    if(state.screen==="create"){ wireCreate(); return; }
    if(state.screen==="detail"){ wireDetail(); return; }
    if(state.screen==="profile"){ wireProfile(); return; }
    wireHome();
  }

  function wireAuth(){
    if(state.authTab==="admin"){
      document.querySelectorAll("a[data-tab]").forEach(function(el){el.onclick=function(ev){ev.preventDefault();state.authTab=el.getAttribute("data-tab");state.error="";render();};});
      byId("adminSubmit",function(el){el.onclick=function(){ doAdminLogin(val("ad_user"),val("ad_pass")); };});
      byId("ad_pass",function(el){el.onkeydown=function(ev){if(ev.key==="Enter")document.getElementById("adminSubmit").click();};});
      return;
    }
    byId("demoBtn",function(el){el.onclick=doDemo;});
    document.querySelectorAll(".tab[data-tab]").forEach(function(el){el.onclick=function(){state.authTab=el.getAttribute("data-tab");state.error="";render();};});
    document.querySelectorAll("a[data-tab]").forEach(function(el){el.onclick=function(ev){ev.preventDefault();state.authTab=el.getAttribute("data-tab");state.error="";render();};});
    if(state.authTab==="google"){
      byId("googleSubmit",function(el){el.onclick=function(){ doGoogleContinue(val("au_gmail")); };});
      byId("au_gmail",function(el){el.onkeydown=function(ev){if(ev.key==="Enter")document.getElementById("googleSubmit").click();};});
      return;
    }
    byId("authSubmit",function(el){el.onclick=function(){var u=val("au_user"),pw=val("au_pass"); if(state.authTab==="register")doRegister(u,pw);else doLogin(u,pw);};});
    byId("au_pass",function(el){el.onkeydown=function(ev){if(ev.key==="Enter")document.getElementById("authSubmit").click();};});
  }

  function wireHome(){
    document.querySelectorAll("[data-scope]").forEach(function(el){el.onclick=function(){state.scope=el.getAttribute("data-scope");render();};});
    byId("createBtn2",function(el){el.onclick=startCreate;});
    document.querySelectorAll("[data-open]").forEach(function(el){el.onclick=function(){state.detailId=el.getAttribute("data-open");state.screen="detail";state.open={prep:false};render();};});
    document.querySelectorAll("[data-copy]").forEach(function(el){el.onclick=function(ev){ev.stopPropagation();copyEntry(el.getAttribute("data-copy"));};});
    document.querySelectorAll("[data-del]").forEach(function(el){el.onclick=function(ev){ev.stopPropagation();delEntry(el.getAttribute("data-del"));};});
  }

  function startCreate(){ if(!profileComplete(state.user)){state.screen="profile";toast("Complete your profile first.","warn");render();return;} state.createStep={type:"TI",amount:"",subject:""}; state.error=""; state.screen="create"; render(); }
  function wireCreate(){
    document.querySelectorAll("[data-ctype]").forEach(function(el){el.onclick=function(){state.createStep.type=el.getAttribute("data-ctype");state.createStep.amount=val("cr_amount");state.createStep.subject=val("cr_subject");render();};});
    byId("cr_save",function(el){el.onclick=function(){
      var amount=val("cr_amount").replace(/[^0-9.]/g,""), subject=val("cr_subject").trim();
      if(!amount){state.error="Enter an amount.";render();return;}
      if(!subject){state.error="Enter a purpose / subject.";render();return;}
      var e=newEntry(state.createStep.type,amount,subject); e.status="Draft"; saveEntry(e);
      state.detailId=e.id; state.screen="detail"; state.open={prep:true}; state.error=""; toast(state.createStep.type+" created.","ok"); render();
    };});
    byId("cr_cancel",function(el){el.onclick=function(){state.screen="home";state.error="";render();};});
  }

  function copyEntry(id){ var e=getEntry(id); if(!e)return; var c=newEntry(e.type,e.amount,e.subject); c.letter.refPrefix=e.letter.refPrefix; c.letter.sendingAddress=e.letter.sendingAddress; c.letter.bodyParas=e.letter.bodyParas.slice(); c.letter.attachments=e.letter.attachments.slice(); saveEntry(c); toast("Copied letter format — fresh record.","ok"); render(); }
  function delEntry(id){ if(!confirm("Delete this entry?"))return; var k=state.user.username.toLowerCase(); if(DB.entries[k])delete DB.entries[k][id]; loadEntries(); toast("Deleted.","ok"); render(); }

  function wireProfile(){
    document.querySelectorAll("[data-coll]").forEach(function(el){el.onclick=function(){var k=el.getAttribute("data-coll");readProfileFields();state.open[k]=!state.open[k];render();};});
    byId("saveProfile",function(el){el.onclick=function(){readProfileFields(); DB.employees[state.user.username.toLowerCase()]=state.user; toast("Profile saved.","ok"); render();};});
    ["pf_name","pf_desig","pf_office","pf_letter","pf_bname","pf_bdesig","pf_boffice","pf_borg"].forEach(function(id){byId(id,function(el){el.oninput=updateProfilePreview;});});
    byId("pf_salut",function(el){el.onchange=updateProfilePreview;});
  }
  function readProfileFields(){
    var p=state.user;
    if(!document.getElementById("pf_name")) return;
    p.name=val("pf_name");p.designation=val("pf_desig");p.office=val("pf_office");p.letterNo=val("pf_letter");p.sapNo=val("pf_sap");p.cpfNo=val("pf_cpf");p.pmoNo=val("pf_pmo");p.bossName=val("pf_bname");p.bossDesignation=val("pf_bdesig");p.bossOffice=val("pf_boffice");p.bossOrg=val("pf_borg");p.bossSalutation=val("pf_salut");
  }
  function updateProfilePreview(){ readProfileFields(); var host=document.getElementById("pfLetterHost"); if(host){ host.innerHTML=letterSheet(state.user,previewEntry(state.user)); fitLetterPages(); } }

  // ── Detail wiring ──
  function wireDetail(){
    var e=getEntry(state.detailId);
    byId("backHome",function(el){el.onclick=function(){state.screen="home";render();};});
    byId("d_saveHead",function(el){el.onclick=function(){e.amount=val("d_amount").replace(/[^0-9.]/g,"");e.subject=val("d_subject");saveEntry(e);toast("Saved.","ok");render();};});
    document.querySelectorAll("[data-coll]").forEach(function(el){el.onclick=function(){var k=el.getAttribute("data-coll");readLetterFields(e);syncEditors(e);state.open[k]=!state.open[k];render();};});

    hydrateEditors(e.letter.bodyParas);
    wireRichToolbars(e);
    ["l_prefix","l_num","l_date","l_addr"].forEach(function(id){byId(id,function(el){el.oninput=function(){readLetterFields(e);refreshPreview(e);};});});
    byId("addAtt",function(el){el.onclick=function(){readLetterFields(e);syncEditors(e);if(e.letter.attachments.length<5){e.letter.attachments.push("");saveEntry(e);render();}};});
    document.querySelectorAll(".att-input").forEach(function(el){el.oninput=function(){e.letter.attachments[parseInt(el.getAttribute("data-attidx"),10)]=el.value;refreshPreview(e);};});
    document.querySelectorAll(".att-del").forEach(function(el){el.onclick=function(){readLetterFields(e);syncEditors(e);e.letter.attachments.splice(parseInt(el.getAttribute("data-attdel"),10),1);saveEntry(e);render();};});
    byId("l_save",function(el){el.onclick=function(){readLetterFields(e);syncEditors(e); if(e.status==="Draft")e.status="Sent"; saveEntry(e);toast("Application saved.","ok");render();};});
    byId("dlWord",function(el){el.onclick=function(){downloadLetterWord(e);};});
    byId("dlPdf",function(el){el.onclick=function(){downloadLetterPdf(e);};});
    byId("dlPrint",function(el){el.onclick=function(){printLetter(e);};});

    wireStatus(e);
    wireAccounts(e);
    wireHistory(e);
    wireForm2(e);
    wireVouchers(e);
  }
  function hydrateEditors(paras){[0,1,2,3].forEach(function(i){var ed=document.getElementById("l_body"+i);if(ed&&ed.innerHTML!==(paras[i]||""))ed.innerHTML=paras[i]||"";});}
  function syncEditors(e){[0,1,2,3].forEach(function(i){var ed=document.getElementById("l_body"+i);if(ed)e.letter.bodyParas[i]=ed.innerHTML;});}
  function readLetterFields(e){var L=e.letter;if(document.getElementById("l_prefix"))L.refPrefix=val("l_prefix");if(document.getElementById("l_num"))L.refNumber=val("l_num");if(document.getElementById("l_date"))L.refDate=val("l_date");if(document.getElementById("l_addr"))L.sendingAddress=val("l_addr");}
  function refreshPreview(e){var host=document.getElementById("letterPreview");if(host){host.innerHTML=letterSheet(state.user,e);fitLetterPages();}}

  function wireRichToolbars(e){
    document.querySelectorAll(".rt-editor").forEach(function(ed){ed.oninput=function(){syncEditors(e);refreshPreview(e);};});
    document.querySelectorAll(".rt-toolbar[data-for]").forEach(function(tb){
      var tid=tb.getAttribute("data-for");
      tb.querySelectorAll(".rt-btn[data-cmd]").forEach(function(b){
        b.onmousedown=function(ev){
          ev.preventDefault(); var ed=document.getElementById(tid); ed.focus();
          var cmd=b.getAttribute("data-cmd");
          if(cmd==="reset"){ document.execCommand("removeFormat",false,null); document.execCommand("foreColor",false,"#101826"); }
          else document.execCommand(cmd,false,null);
          syncEditors(e); refreshPreview(e);
        };
      });
      var fontSel=tb.querySelector(".rt-font");
      if(fontSel){ fontSel.onchange=function(){ var ed=document.getElementById(tid); ed.focus(); document.execCommand("fontName",false,fontSel.value); syncEditors(e); refreshPreview(e); }; }
      var sizeSel=tb.querySelector(".rt-size");
      if(sizeSel){ sizeSel.onchange=function(){ var ed=document.getElementById(tid); ed.focus(); applyFontSize(ed,sizeSel.value); syncEditors(e); refreshPreview(e); }; }
    });
    document.querySelectorAll(".rt-toolbar2[data-for]").forEach(function(tb){
      var tid=tb.getAttribute("data-for");
      tb.querySelectorAll(".rt-color").forEach(function(c){ c.onmousedown=function(ev){ ev.preventDefault(); var ed=document.getElementById(tid); ed.focus(); document.execCommand("foreColor",false,c.getAttribute("data-color")); syncEditors(e); refreshPreview(e); }; });
      tb.querySelectorAll(".rt-hicolor").forEach(function(c){ c.onmousedown=function(ev){ ev.preventDefault(); var ed=document.getElementById(tid); ed.focus(); var col=c.getAttribute("data-hicolor"); try{ document.execCommand("hiliteColor",false,col); }catch(_e){ document.execCommand("backColor",false,col); } syncEditors(e); refreshPreview(e); }; });
    });
  }

  function wireStatus(e){
    var a=e.appStatus;
    document.querySelectorAll("[data-rec]").forEach(function(el){el.onclick=function(){a.recommended=el.getAttribute("data-rec");saveEntry(e);render();};});
    document.querySelectorAll("[data-cred]").forEach(function(el){el.onclick=function(){a.credited=el.getAttribute("data-cred");if(a.credited==="yes"){state.open.accounts=true;e.status="Open";}saveEntry(e);render();};});
    byId("st_save",function(el){el.onclick=function(){
      a.submitted=document.getElementById("st_submitted").checked; a.submittedRemark=val("st_submittedRemark");
      if(document.getElementById("st_recAmount"))a.recAmount=val("st_recAmount"); a.recRemark=val("st_recRemark");
      a.sentToAccounts=document.getElementById("st_sent").checked; a.sentRemark=val("st_sentRemark");
      a.creditRemark=val("st_creditRemark");
      if(a.submitted&&e.status==="Draft")e.status="Sent";
      if(a.sentToAccounts)e.status="Sent to Accounts";
      if(a.credited==="yes")e.status="Open";
      saveEntry(e);toast("Status saved.","ok");render();
    };});
  }

  var txnMode=null, txnDraft={};
  function wireAccounts(e){
    byId("makeEntry",function(el){el.onclick=function(){txnMode=null;renderTxnForm(e);};});
    document.querySelectorAll("[data-txndel]").forEach(function(el){el.onclick=function(){var id=el.getAttribute("data-txndel");e.txns=e.txns.filter(function(x){return x.id!==id;});if(e.txns.length===0)e.status="Open";saveEntry(e);render();};});
    document.querySelectorAll("[data-pavword]").forEach(function(el){el.onclick=function(){downloadPavatiWord(e,findTxn(e,el.getAttribute("data-pavword")));};});
    document.querySelectorAll("[data-pavpdf]").forEach(function(el){el.onclick=function(){downloadPavatiPdf(e,findTxn(e,el.getAttribute("data-pavpdf")));};});
    document.querySelectorAll("[data-pavprint]").forEach(function(el){el.onclick=function(){printPavati(e,findTxn(e,el.getAttribute("data-pavprint")));};});
    // pavati inline fields

    // closure / recoupment
    byId("processClose",function(el){el.onclick=function(){ openClosureForm(e,"close"); };});
    byId("processRecoup",function(el){el.onclick=function(){ openClosureForm(e,"recoup"); };});

  var actionMode=null;
  function openClosureForm(e,mode){
    actionMode=mode;
    var host=document.getElementById("actionFormHost"); if(!host) return;
    var t=totals(e), u=utilization(e);
    if(mode==="close"){
      // TI closure
      if(t.balance>=0){
        host.innerHTML=closureFormHtml("Process Imprest Closure","Underspent by Rs. "+inr(t.balance)+". Enter details of the amount being returned to the company.", "return", t.balance);
        wireClosureForm(e,"return",t.balance,function(){ e.status="Closed"; });
      } else {
        host.innerHTML=closureFormHtml("Process Imprest Closure","Overspent by Rs. "+inr(-t.balance)+" (paid from pocket). This will be sent to Accounts for reimbursement.","reimburse-init",-t.balance);
        byId("actClose_send",function(el){ el.onclick=function(){
          e.closure={kind:"reimburse",amount:-t.balance,stage:"pending"};
          e.status="Sent to Accounts"; saveEntry(e); toast("Sent to Accounts for reimbursement.","ok"); render();
        };});
      }
    } else if(mode==="recoup"){
      if(!u.overspent){
        var pending=u.limit-u.cycleExp;
        host.innerHTML='<div class="closure-card"><div class="card-head"><h3>Process Recoupment</h3></div>'+
          '<div class="locked-note">⚠ Balance Amount Rs. '+inr(pending)+' pending — this cycle isn\'t exhausted yet. Recoupment only applies once the limit is used up. Only <b>Process PI Closure</b> can be processed at this time.</div>'+
          '<button class="btn btn-ghost btn-sm" id="act_cancel" style="margin-top:10px">← Back</button></div>';
        byId("act_cancel",function(el){el.onclick=function(){ document.getElementById("actionFormHost").innerHTML=""; };});
      } else {
        var overspent=Math.max(0,u.cycleExp-u.limit);
        var fresh=parseFloat(e.amount)||0;
        host.innerHTML=recoupFormHtml(overspent,fresh);
        wireRecoupForm(e);
      }
    } else if(mode==="piclose"){
      if(t.balance>=0){
        host.innerHTML=closureFormHtml("Process PI Closure (final)","Underspent by Rs. "+inr(t.balance)+". Enter details of the amount being returned to the company. No fresh amount will follow — this PI is closed for the year.","return",t.balance);
        wireClosureForm(e,"return",t.balance,function(){ e.status="Closed"; e.recoupments.push({id:uid(),date:todayISO(),overspentAmount:0,freshAmount:0,totalCredit:0,final:true,settled:"linked"}); });
      } else {
        host.innerHTML=closureFormHtml("Process PI Closure (final)","Overspent by Rs. "+inr(-t.balance)+" (paid from pocket). No fresh amount will follow. This will be sent to Accounts for reimbursement, closing the PI for the year.","reimburse-init",-t.balance);
        byId("actClose_send",function(el){ el.onclick=function(){
          e.closure={kind:"reimburse",amount:-t.balance,stage:"pending"};
          e.status="Sent to Accounts"; e.recoupments.push({id:uid(),date:todayISO(),overspentAmount:-t.balance,freshAmount:0,totalCredit:0,final:true,settled:"linked"});
          saveEntry(e); toast("Sent to Accounts for reimbursement — PI closure pending.","ok"); render();
        };});
      }
    }
  }

  function wireRecoupForm(e){
    var mode="cash";
    document.querySelectorAll("[data-rcmode]").forEach(function(el){el.onclick=function(){setPill(el,"data-rcmode");mode=el.getAttribute("data-rcmode");document.getElementById("rc_utrWrap").style.display=mode==="online"?"block":"none";};});
    function recompute(){ var ov=parseFloat(val("rc_overspent"))||0, fr=parseFloat(val("rc_fresh"))||0; document.getElementById("rc_total").value=inr(ov+fr); }
    byId("rc_overspent",function(el){el.oninput=recompute;});
    byId("rc_fresh",function(el){el.oninput=recompute;});
    byId("rc_save",function(el){el.onclick=function(){
      var ov=parseFloat(val("rc_overspent"))||0, fr=parseFloat(val("rc_fresh"))||0, total=ov+fr;
      var id=uid(), date=val("rc_date");
      e.recoupments.push({id:id,date:date,overspentAmount:ov,freshAmount:fr,totalCredit:total,mode:mode,utr:val("rc_utr"),final:false,settled:"pending"});
      saveEntry(e); toast("Recoupment submitted — awaiting settlement confirmation.","ok");
      document.getElementById("actionFormHost").innerHTML=""; render();
    };});
    byId("rc_cancel",function(el){el.onclick=function(){ document.getElementById("actionFormHost").innerHTML=""; };});
  }
  function confirmRecoupmentSettlement(e,id,decision,remark){
    var r=(e.recoupments||[]).filter(function(x){return x.id===id;})[0]; if(!r) return;
    r.settled=decision; r.settledRemark=remark||""; r.settledDate=todayISO();
    if(decision==="yes"){
      e.txns.push({id:uid(),kind:"received",amount:r.totalCredit,date:r.date,mode:r.mode,utr:r.utr,recoupmentId:r.id,overspentAmount:r.overspentAmount,freshAmount:r.freshAmount});
    }
    saveEntry(e);
    toast(decision==="yes"?"Recoupment settled — new cycle started.":"Marked as not yet settled.","ok");
    render();
  }

      wireImg("tr_img");

      };});

      host.querySelectorAll("[data-temode]").forEach(function(el){el.onclick=function(){setPill(el,"data-temode");txnDraft.paid=el.getAttribute("data-temode");document.getElementById("te_utrWrap").style.display=txnDraft.paid==="online"?"block":"none";};});
      wireImg("te_img");
      byId("te_save",function(el){el.onclick=function(){
        var amt=val("te_amount").replace(/[^0-9.]/g,""); if(!amt){toast("Enter amount.","err");return;}
        var bill=txnDraft.bill||"no";
        var billStage=bill==="no" ? (txnDraft.billStage||"later") : "";
        e.txns.push({
          id:uid(), kind:"expense", amount:amt, date:val("te_date"),
          paidTo:val("te_paidTo"),
          paid:txnDraft.paid||"cash", utr:val("te_utr"), image:imgData["te_img"]||"",
          billAvailable:bill, billStage:billStage,
          nameOfWork:bill==="yes"?val("te_nameWork"):"", agency:bill==="yes"?val("te_agency"):"",
          billNo:bill==="yes"?val("te_billNo"):"", submittedBy:bill==="yes"?val("te_submittedBy"):"",
          pavati:{generated:false,personsCount:1,persons:[""],workPerformed:"",image:""}
        });

        toast(bill==="yes"?"Expense with bill added.":(billStage==="fill"?"Expense booked — fill Pavati below.":"Expense booked — bill pending."),"ok");

      };});
      byId("te_cancel",function(el){el.onclick=function(){txnMode=null;renderTxnForm(e);};});
    }
  }

  // ── Rich-text aware PDF rendering ──
  function pdfFontFamily(font){
    if(!font) return "helvetica";
    var f=font.toLowerCase();
    if(f.indexOf("times")>-1||f.indexOf("georgia")>-1||f.indexOf("serif")>-1) return "times";
    if(f.indexOf("courier")>-1||f.indexOf("mono")>-1) return "courier";
    return "helvetica";
  }
  function pdfFontStyle(bold,italic){ if(bold&&italic) return "bolditalic"; if(bold) return "bold"; if(italic) return "italic"; return "normal"; }
  function renderRichParagraphPdf(doc,html,x,y,maxWidth,baseSize,forceAlign){
    var parsed=parseRichHtml(html);
    var align=forceAlign||parsed.align||"left";
    var maxSize=baseSize;
    parsed.runs.forEach(function(r){ if(r.size&&r.size>maxSize) maxSize=r.size; });
    var lineHeight=maxSize*1.4;
    var lines=[]; var cur=[];
    parsed.runs.forEach(function(r){
      var parts=(r.text||"").split(/(\s+|\n)/).filter(function(p){return p.length>0;});
      parts.forEach(function(p){
        if(p==="\n"){ lines.push(cur); cur=[]; return; }
        cur.push({text:p,bold:r.bold,italic:r.italic,underline:r.underline,color:r.color,font:r.font,size:r.size||baseSize});
      });
    });
    lines.push(cur);
    var visualLines=[];
    lines.forEach(function(tokens){
      var line=[],w=0;
      tokens.forEach(function(tok){
        doc.setFont(pdfFontFamily(tok.font),pdfFontStyle(tok.bold,tok.italic)); doc.setFontSize(tok.size);
        var tw=doc.getTextWidth(tok.text);
        if(w+tw>maxWidth && line.length){ visualLines.push(line); line=[]; w=0; }
        line.push({tok:tok,width:tw}); w+=tw;
      });
      visualLines.push(line);
    });
    visualLines.forEach(function(lt){
      var lineW=lt.reduce(function(s,t){return s+t.width;},0);
      var sx=x; if(align==="center") sx=x+(maxWidth-lineW)/2; else if(align==="right") sx=x+(maxWidth-lineW);
      var cx=sx;
      lt.forEach(function(item){
        var tok=item.tok;
        doc.setFont(pdfFontFamily(tok.font),pdfFontStyle(tok.bold,tok.italic)); doc.setFontSize(tok.size);
        try{ doc.setTextColor(tok.color||"#1a1a1a"); }catch(_e){ doc.setTextColor("#1a1a1a"); }
        doc.text(tok.text,cx,y);
        if(tok.underline){ doc.setDrawColor(0); doc.setLineWidth(0.5); doc.line(cx,y+2,cx+item.width,y+2); }
        cx+=item.width;
      });
      doc.setTextColor("#1a1a1a");
      y+=lineHeight;
    });
    return y;
  }

  // ── Form-2 downloads ──
  function form2Rows(e){
    var t=totals(e);
    var allTxns=(e.txns||[]).slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
    var rows=allTxns.map(function(tx,i){
      var particulars = tx.kind==="received" ? ("Amount received as "+e.type) : ((tx.nameOfWork||"Expense")+(tx.billAvailable==="no"?" (Bill not received)":" ("+voucherNoFor(e,tx.id)+")"));
      return [i+1, fmtDate(tx.date), particulars, tx.kind==="received"?tx.amount:"", tx.kind==="expense"?tx.amount:""];
    });
    return { rows:rows, totals:t };
  }
  function downloadForm2Excel(e){ toast("Preparing Excel…","ok"); ensureXlsx().then(function(){ buildForm2Excel(e); }).catch(function(){toast("Could not load Excel library.","err");}); }
  function buildForm2Excel(e){
    var p=state.user, F=e.form2, d=form2Rows(e);
    var sap=F.sapNo||p.sapNo||"", cpf=F.cpfNo||p.cpfNo||"", pmo=F.pmoNo||p.pmoNo||"";
    var aoa=[
      ["FORM-2 : IMPREST CASH ACCOUNT"],[],
      ["Name",p.name||""],["Designation",p.designation||""],["SAP No.",sap],["CPF No.",cpf]
    ];
    if(pmo) aoa.push(["PMO No.",pmo]);
    aoa.push(["Period",fmtDate(F.dateFrom)+" to "+fmtDate(F.dateTo)]);
    aoa.push([]);
    var headerRowIdx=aoa.length;
    aoa.push(["Sno","Date","Particulars","Receipt (Rs.)","Payment (Rs.)"]);
    d.rows.forEach(function(r){ aoa.push(r); });
    var lastDataRow=aoa.length-1;
    aoa.push(["","","Total",d.totals.recv,d.totals.exp]);
    if(d.totals.balance>=0){
      aoa.push(["","","Balance (Amount Paid Back)",F.amountPaidBack||d.totals.balance,""]);
      aoa.push([]); aoa.push(["Refund Account No.",F.refundAccount||""]); aoa.push(["Refund UTR",F.refundUTR||""]);
    } else {
      aoa.push(["","","Extra Amount Paid from Pocket",F.amountPaidBack||(-d.totals.balance),""]);
      aoa.push([]); aoa.push(["Note","Kindly reimburse the same."]); aoa.push(["Reimbursement UTR",F.refundUTR||""]);
    }
    var ws=window.XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:8},{wch:12},{wch:34},{wch:14},{wch:14}];
    // Best-effort borders + center alignment — the free client-side SheetJS build has limited
    // style support, so this may not render in every viewer; the Web/PDF/Print versions always show it fully.
    try{
      var range=window.XLSX.utils.decode_range(ws['!ref']);
      for(var R=headerRowIdx;R<=lastDataRow+1;R++){
        for(var C=0;C<=4;C++){
          var addr=window.XLSX.utils.encode_cell({r:R,c:C});
          if(!ws[addr]) continue;
          ws[addr].s={
            alignment:{horizontal:"center",vertical:"center"},
            border:{top:{style:"thin"},bottom:{style:"thin"},left:{style:"thin"},right:{style:"thin"}},
            font: R===headerRowIdx ? {bold:true} : undefined,
          };
        }
      }
    }catch(_e){}
    var wb=window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb,ws,"Form-2");
    window.XLSX.writeFile(wb,"Form2_"+(e.letter.refNumber||e.id)+".xlsx",{cellStyles:true}); toast("Excel downloaded.","ok");
  }

  function buildForm2Pdf(e){
    var p=state.user,F=e.form2,d=form2Rows(e); var doc=new window.jspdf.jsPDF({unit:"pt",format:"a4"});
    var W=doc.internal.pageSize.getWidth(),M=40,y=50;

    var head=["Name: "+(p.name||""),"Designation: "+(p.designation||""),"SAP No.: "+(F.sapNo||p.sapNo||""),"CPF No.: "+(F.cpfNo||p.cpfNo||"")];
    if(F.pmoNo||p.pmoNo) head.push("PMO No.: "+(F.pmoNo||p.pmoNo));
    head.push("Period: "+fmtDate(F.dateFrom)+" to "+fmtDate(F.dateTo));
    head.forEach(function(line){ doc.text(line,M,y); y+=14; });
    y+=8;
    var tableW=W-2*M;
    var colW=[36,60,tableW-36-60-90-90,90,90];
    var colX=[M]; for(var ci=1;ci<colW.length;ci++) colX.push(colX[ci-1]+colW[ci-1]);
    function centerText(text,x,w,yy){ doc.text(String(text),x+w/2,yy,{align:"center"}); }
    function rowRects(y0,h){ colW.forEach(function(w,i){ doc.setDrawColor(150); doc.rect(colX[i],y0,w,h); }); }

    doc.setFont("helvetica","bold").setFontSize(9.5);
    var headH=18; rowRects(y,headH);
    ["Sno","Date","Particulars","Receipt (Rs.)","Payment (Rs.)"].forEach(function(h,i){ centerText(h,colX[i],colW[i],y+13); });
    y+=headH;
    doc.setFont("helvetica","normal");
    d.rows.forEach(function(r){
      var lines=doc.splitTextToSize(String(r[2]),colW[2]-8);
      var rh=Math.max(16, lines.length*11+6);
      if(y+rh>760){ doc.addPage(); y=50; doc.setFont("helvetica","bold"); rowRects(y,headH); ["Sno","Date","Particulars","Receipt (Rs.)","Payment (Rs.)"].forEach(function(h,i){ centerText(h,colX[i],colW[i],y+13); }); y+=headH; doc.setFont("helvetica","normal"); }
      rowRects(y,rh);
      centerText(r[0],colX[0],colW[0],y+rh/2+3);
      centerText(r[1],colX[1],colW[1],y+rh/2+3);
      doc.text(lines,colX[2]+colW[2]/2,y+rh/2 - (lines.length-1)*5.5 + 3,{align:"center"});
      centerText(r[3]?inr(r[3]):"",colX[3],colW[3],y+rh/2+3);
      centerText(r[4]?inr(r[4]):"",colX[4],colW[4],y+rh/2+3);
      y+=rh;
    });
    var totH=18; rowRects(y,totH);
    doc.setFont("helvetica","bold");
    centerText("Total",colX[2],colW[2],y+13);
    centerText(inr(d.totals.recv),colX[3],colW[3],y+13);
    centerText(inr(d.totals.exp),colX[4],colW[4],y+13);
    y+=totH+18;

    if(d.totals.balance>=0){
      doc.text("Amount Paid Back: Rs. "+inr(F.amountPaidBack||d.totals.balance),M,y); y+=18;
      doc.setFont("helvetica","normal"); doc.text("Refund Account No.: "+(F.refundAccount||"—"),M,y); y+=14; doc.text("Refund UTR: "+(F.refundUTR||"—"),M,y);
    } else {
      doc.text("Extra Amount Paid from Pocket: Rs. "+inr(-d.totals.balance),M,y); y+=18;
      doc.setFont("helvetica","normal"); doc.text("Kindly reimburse the same.",M,y); y+=14; doc.text("Reimbursement UTR: "+(F.refundUTR||"—"),M,y);
    }
    doc.save("Form2_"+(e.letter.refNumber||e.id)+".pdf"); toast("Form-2 PDF downloaded.","ok");
  }

    var thinBorder={style:BS.SINGLE,size:2,color:"999999"};
    var cellBorders={top:thinBorder,bottom:thinBorder,left:thinBorder,right:thinBorder};
    function cell(text,bold){ return new TC({borders:cellBorders,children:[new P({alignment:AL.CENTER,children:[new T({text:String(text),bold:!!bold})]})]}); }
    var rows=[ new TR({children:[cell("Sno",true),cell("Date",true),cell("Particulars",true),cell("Receipt (Rs.)",true),cell("Payment (Rs.)",true)]}) ];

    rows.push(new TR({children:[cell(""),cell(""),cell("Total",true),cell(inr(d.totals.recv),true),cell(inr(d.totals.exp),true)]}));

    if(d.totals.balance>=0){
      children.push(new P({children:[new T({text:"Amount Paid Back: ",bold:true}),new T("Rs. "+inr(F.amountPaidBack||d.totals.balance))]}));

    }
    var doc=new docx.Document({sections:[{children:children}]});
    docx.Packer.toBlob(doc).then(function(blob){ saveBlob(blob,"Form2_"+(e.letter.refNumber||e.id)+".docx"); toast("Word downloaded — open with Google Docs if needed.","ok"); });
  }
